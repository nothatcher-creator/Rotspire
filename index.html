<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>WebLab — Front-End Playground</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#0e131d;--line:#202b3a;--text:#ecf3ff;--muted:#8290a4;--accent:#72e6b1;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,textarea,input{font:inherit}.app{height:100dvh;display:grid;grid-template:58px 1fr/210px 1fr}.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#080b12f2}.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#72e6b1,#38bdf8);color:#04110d;font-weight:950}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}.actions{display:flex;gap:6px;align-items:center}.btn,.preset,.tab,.device{border:0;cursor:pointer;color:inherit}.btn{height:34px;padding:0 11px;border-radius:9px;background:#111824;border:1px solid var(--line);font-size:11px;font-weight:800}.btn.run{background:var(--accent);color:#04100c;border:0}.auto{display:flex;align-items:center;gap:6px;padding:0 8px;height:34px;border:1px solid var(--line);border-radius:9px;color:var(--muted);font-size:10px;font-weight:800}.auto input{accent-color:var(--accent)}.side{min-height:0;overflow:auto;padding:12px 9px;border-right:1px solid var(--line);background:#0a0e16}.side h3{margin:2px 5px 9px;color:var(--muted);font-size:9px;letter-spacing:.18em}.presets{display:grid;gap:5px}.preset{padding:9px;border:1px solid transparent;border-radius:9px;text-align:left;background:transparent}.preset:hover{background:#101722}.preset.active{background:#14231e;border-color:#285341}.preset b{display:block;font-size:11px}.preset span{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.3}.work{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr);grid-template-rows:1fr 155px;gap:1px;background:var(--line)}.panel{min-width:0;min-height:0;background:var(--panel)}.editor{grid-row:1/3;display:flex;flex-direction:column}.preview{display:flex;flex-direction:column}.console{display:flex;flex-direction:column}.bar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid #17202d;background:#0c111a}.tabs,.devices{display:flex;align-items:center;gap:2px;height:100%}.tab{height:100%;padding:0 10px;background:transparent;color:#6f7d90;font-size:10px;font-weight:800;position:relative}.tab.active{color:#fff}.tab.active:after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--accent)}.editors{position:relative;flex:1;min-height:0}.wrap{position:absolute;inset:0;display:none}.wrap.active{display:block}textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:15px 17px;background:#0b1018;color:#d8e3f0;caret-color:var(--accent);tab-size:2;font:500 12px/1.65 Consolas,monospace}.status{display:flex;align-items:center;gap:6px;font-size:10px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}#runState{color:var(--muted);font-size:9px}.device{height:27px;padding:0 7px;border-radius:7px;background:transparent;color:var(--muted);font-size:9px;font-weight:800}.device.active{background:#16261f;color:#d9fff0}.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:auto;background:#171d28;background-image:linear-gradient(45deg,#1d2533 25%,transparent 25%),linear-gradient(-45deg,#1d2533 25%,transparent 25%);background-size:20px 20px}iframe{width:100%;height:100%;min-height:260px;border:0;background:#fff;transition:.15s}.consoleHead{font-size:10px}.consoleHead span{color:var(--muted);font-size:9px;margin-left:6px}.clear{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:800;cursor:pointer}.out{flex:1;overflow:auto;background:#090d14;font:500 10px/1.45 Consolas,monospace}.empty{padding:10px;color:#49566a}.row{display:grid;grid-template-columns:40px 1fr;gap:5px;padding:4px 10px;border-bottom:1px solid #121923;color:#aab7c8;white-space:pre-wrap;overflow-wrap:anywhere}.row:before{content:attr(data-level);color:#59677a;font-size:8px;font-weight:900;text-transform:uppercase}.row.warn{color:#f8d98a;background:#2d240b33}.row.error{color:#ff9aaa;background:#37121a44}.row.info{color:#8dddfb}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,15px);padding:8px 12px;border:1px solid #314158;border-radius:9px;background:#111927;font-size:10px;font-weight:800;opacity:0;transition:.15s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template:58px auto 1fr/1fr}.side{grid-row:2;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding:7px}.side h3{display:none}.presets{display:flex}.preset{width:125px;flex:none}.preset span{display:none}.work{grid-row:3;grid-template:430px 420px 170px/1fr}.editor{grid-row:1}.preview{grid-row:2}.console{grid-row:3}}@media(max-width:520px){.btn:not(.run),.brand small{display:none}.top{padding:0 7px}.work{grid-template-rows:470px 420px 170px}.tab{padding:0 7px}textarea{padding:12px;font-size:11.5px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><div class="logo">W</div><div><b>WebLab</b><small>front-end playground</small></div></div>
<div class="actions"><label class="auto"><input id="auto" type="checkbox" checked>Auto</label><button id="share" class="btn">Share</button><button id="export" class="btn">Export</button><button id="run" class="btn run">Run</button></div>
</header>
<aside class="side"><h3>STARTERS</h3><div id="presets" class="presets"></div></aside>
<main class="work">
<section class="panel editor">
<div class="bar"><div class="tabs"><button class="tab active" data-tab="html">HTML</button><button class="tab" data-tab="css">CSS</button><button class="tab" data-tab="js">JavaScript</button></div><button id="reset" class="clear">Reset preset</button></div>
<div class="editors"><label class="wrap active" data-editor="html"><textarea id="html" spellcheck="false"></textarea></label><label class="wrap" data-editor="css"><textarea id="css" spellcheck="false"></textarea></label><label class="wrap" data-editor="js"><textarea id="js" spellcheck="false"></textarea></label></div>
</section>
<section class="panel preview">
<div class="bar"><div class="status"><span class="dot"></span><b>Preview</b><span id="runState">ready</span></div><div class="devices"><button class="device active" data-width="full">Full</button><button class="device" data-width="390">Phone</button><button class="device" data-width="768">Tablet</button></div></div>
<div id="stage" class="stage"><iframe id="frame" title="WebLab preview" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads"></iframe></div>
</section>
<section class="panel console"><div class="bar"><div class="consoleHead"><b>Console</b><span id="count">0 messages</span></div><button id="clear" class="clear">Clear</button></div><div id="out" class="out"><div class="empty">Console output will appear here.</div></div></section>
</main>
</div>
<div id="toast" class="toast"></div>
<script type="module">
const P={
blank:{n:'Blank',d:'Clean HTML/CSS/JS page',h:'<main class="stagex">\n  <h1>Hello WebLab</h1>\n  <p>Edit the code, then press Run.</p>\n</main>',c:':root{font-family:system-ui;color-scheme:dark}body{margin:0;background:#111827;color:#f8fafc}.stagex{min-height:100vh;display:grid;place-content:center;text-align:center;padding:2rem}h1{font-size:clamp(2rem,8vw,5rem);margin:0}p{color:#94a3b8}',j:"console.log('Blank preset ready')"},
three:{n:'Three.js Cube',d:'Live 3D WebGL starter',h:'<div id="scene"></div><div class="tag">THREE.JS TEST</div>',c:'html,body,#scene{width:100%;height:100%;margin:0;overflow:hidden;background:#020617}.tag{position:fixed;left:1rem;bottom:1rem;padding:.6rem .8rem;border:1px solid #ffffff22;border-radius:99px;background:#0f172acc;color:#cbd5e1;font:700 11px system-ui}',j:"import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';\nconst scene=new THREE.Scene();scene.background=new THREE.Color(0x020617);\nconst camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);camera.position.set(2.7,1.8,3.3);\nconst renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.querySelector('#scene').appendChild(renderer.domElement);\nconst cube=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),new THREE.MeshStandardMaterial({color:0x7c3aed,roughness:.3,metalness:.2}));scene.add(cube);scene.add(new THREE.HemisphereLight(0xbdd7ff,0x111827,2.3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,4,2);scene.add(light);\nrenderer.setAnimationLoop(t=>{cube.rotation.x=t*.00035;cube.rotation.y=t*.00055;renderer.render(scene,camera)});\naddEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});console.log('Three revision',THREE.REVISION);"},
ui:{n:'UI Components',d:'Buttons, cards and toggle states',h:'<main class="u"><p class="ey">COMPONENT LAB</p><h1>Test UI fast.</h1><div class="acts"><button id="go">Launch test</button><button class="secondary">Secondary</button></div><section><article><span>NEW</span><h2>Card component</h2><p>Change radius, shadows and spacing.</p></article><article><label><input id="toggle" type="checkbox"> Toggle me</label><p id="state">Off</p></article></section></main>',c:'*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#16324f,#07111f 45%);color:#ecfeff;font-family:system-ui}.u{width:min(900px,calc(100% - 2rem));margin:auto;padding:8vh 0}.ey,article span{font-size:.7rem;font-weight:900;letter-spacing:.15em;color:#67e8f9}h1{font-size:clamp(3rem,10vw,6rem);line-height:.9;margin:.5rem 0 1.5rem}.acts{display:flex;gap:.6rem}button{border:0;border-radius:13px;padding:.9rem 1.1rem;background:#67e8f9;color:#06202b;font-weight:900}.secondary{background:#183149;color:#d9f5ff}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}article{min-height:160px;padding:1.3rem;border:1px solid #29445f;border-radius:20px;background:#0b1b2b}p{color:#9fb5ca}',j:"document.querySelector('#go').onclick=()=>console.log('Primary clicked');const t=document.querySelector('#toggle'),s=document.querySelector('#state');t.onchange=()=>{s.textContent=t.checked?'On':'Off';console.info('Toggle',t.checked)}"},
canvas:{n:'Canvas Particles',d:'2D canvas animation test',h:'<canvas id="cv"></canvas><div class="tip">Move your pointer</div>',c:'body{margin:0;overflow:hidden;background:#02040a}canvas{display:block}.tip{position:fixed;top:1rem;left:1rem;padding:.55rem .75rem;border:1px solid #334155;border-radius:99px;background:#0f172acc;color:#9ca3af;font:600 11px system-ui}',j:"const c=document.querySelector('#cv'),x=c.getContext('2d'),p={x:0,y:0},dots=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0015,vy:(Math.random()-.5)*.0015,r:1+Math.random()*2}));let w,h;function rs(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio}addEventListener('resize',rs);addEventListener('pointermove',e=>{p.x=e.clientX*devicePixelRatio;p.y=e.clientY*devicePixelRatio});rs();function f(){x.clearRect(0,0,w,h);for(const d of dots){d.x=(d.x+d.vx+1)%1;d.y=(d.y+d.vy+1)%1;const a=d.x*w,b=d.y*h;x.beginPath();x.fillStyle=Math.hypot(p.x-a,p.y-b)<180*devicePixelRatio?'#67e8f9':'#64748b';x.arc(a,b,d.r*devicePixelRatio,0,Math.PI*2);x.fill()}requestAnimationFrame(f)}f();"},
responsive:{n:'Responsive UI',d:'Grid and breakpoint tester',h:'<header><b>WebLab UI</b><nav>Home　Work　About</nav></header><main><p>RESPONSIVE TEST</p><h1>Resize the preview.</h1><section><article>01<br><span>Flexible grid</span></article><article>02<br><span>Clamp sizing</span></article><article>03<br><span>Mobile stack</span></article></section></main>',c:'*{box-sizing:border-box}body{margin:0;background:#efece5;color:#151515;font-family:Arial}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,5vw,4rem);border-bottom:1px solid #bbb7af}main>p{padding:4rem clamp(1rem,5vw,4rem) 0;font-size:.7rem;font-weight:bold;letter-spacing:.2em}h1{padding:0 clamp(1rem,5vw,4rem);margin:.3rem 0 5rem;font-size:clamp(3rem,12vw,9rem);line-height:.86}section{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #bbb7af}article{min-height:200px;padding:2rem;border-right:1px solid #bbb7af;font-size:2rem}article span{font-size:1rem;color:#716d65}@media(max-width:650px){nav{display:none}section{grid-template-columns:1fr}article{min-height:auto;border-right:0;border-bottom:1px solid #bbb7af}}',j:"console.info('Viewport',innerWidth+'×'+innerHeight);addEventListener('resize',()=>console.info('Viewport',innerWidth+'×'+innerHeight));"}
};
const E={html:document.querySelector('#html'),css:document.querySelector('#css'),js:document.querySelector('#js')},frame=document.querySelector('#frame'),out=document.querySelector('#out'),count=document.querySelector('#count'),runState=document.querySelector('#runState'),auto=document.querySelector('#auto');let current='blank',timer,msgs=0,toastTimer;
function project(){return{html:E.html.value,css:E.css.value,js:E.js.value,preset:current}}
function safe(v){return String(v).replace(/<\/script/gi,'<\\/script')}
function doc(p=project()){return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{min-height:100%;margin:0}${p.css}</style><script>(()=>{const f=v=>{if(typeof v==='string')return v;try{return JSON.stringify(v)}catch{return String(v)}};const s=(l,a)=>parent.postMessage({type:'WEBLAB_CONSOLE',level:l,args:a.map(f)},'*');for(const l of ['log','info','warn','error']){const o=console[l].bind(console);console[l]=(...a)=>{s(l,a);o(...a)}}addEventListener('error',e=>s('error',[e.message+' @ '+e.filename+':'+e.lineno]));addEventListener('unhandledrejection',e=>s('error',['Unhandled promise rejection',e.reason]));parent.postMessage({type:'WEBLAB_READY'},'*')})()<\/script></head><body>${p.html}<script type="module">${safe(p.js)}<\/script></body></html>`}
function clear(){msgs=0;count.textContent='0 messages';out.innerHTML='<div class="empty">Console output will appear here.</div>'}
function run(){clearTimeout(timer);clear();runState.textContent='running…';frame.srcdoc=doc();localStorage.setItem('weblab-v1',JSON.stringify(project()))}
function queue(){localStorage.setItem('weblab-v1',JSON.stringify(project()));if(auto.checked){clearTimeout(timer);timer=setTimeout(run,350)}}
function preset(k,runIt=true){current=k;const p=P[k];E.html.value=p.h;E.css.value=p.c;E.js.value=p.j;renderPresets();queue();if(runIt)run()}
function renderPresets(){const box=document.querySelector('#presets');box.replaceChildren();for(const[k,p]of Object.entries(P)){const b=document.createElement('button');b.className='preset'+(k===current?' active':'');b.innerHTML=`<b>${p.n}</b><span>${p.d}</span>`;b.onclick=()=>preset(k);box.appendChild(b)}}
function add(level,args){if(out.querySelector('.empty'))out.replaceChildren();const r=document.createElement('div');r.className='row '+level;r.dataset.level=level;r.textContent=args.join(' ');out.appendChild(r);msgs++;count.textContent=msgs+' message'+(msgs===1?'':'s');out.scrollTop=out.scrollHeight}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}
for(const e of Object.values(E)){e.addEventListener('input',queue);e.addEventListener('keydown',ev=>{if(ev.key==='Tab'){ev.preventDefault();e.setRangeText('  ',e.selectionStart,e.selectionEnd,'end');e.dispatchEvent(new Event('input'))}})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.wrap').forEach(x=>x.classList.toggle('active',x.dataset.editor===b.dataset.tab));E[b.dataset.tab].focus()});
document.querySelectorAll('.device').forEach(b=>b.onclick=()=>{document.querySelectorAll('.device').forEach(x=>x.classList.toggle('active',x===b));const w=b.dataset.width;frame.style.width=w==='full'?'100%':w+'px';frame.style.flex=w==='full'?'1 1 auto':'0 0 auto';document.querySelector('#stage').style.padding=w==='full'?'0':'12px'});
document.querySelector('#run').onclick=run;document.querySelector('#clear').onclick=clear;document.querySelector('#reset').onclick=()=>preset(current);auto.onchange=()=>{if(auto.checked)run()};
document.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([doc()],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='weblab-experiment.html';a.click();URL.revokeObjectURL(u);toast('Exported HTML')};
document.querySelector('#share').onclick=async()=>{const s=btoa(unescape(encodeURIComponent(JSON.stringify(project())))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');location.hash='p='+s;try{await navigator.clipboard.writeText(location.href);toast('Share link copied')}catch{toast('Share link added to address bar')}};
addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data)return;if(e.data.type==='WEBLAB_CONSOLE')add(e.data.level,e.data.args||[]);if(e.data.type==='WEBLAB_READY')runState.textContent='ready'});addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
function load(){if(location.hash.startsWith('#p=')){try{const s=location.hash.slice(3).replace(/-/g,'+').replace(/_/g,'/'),p=JSON.parse(decodeURIComponent(escape(atob(s))));E.html.value=p.html||'';E.css.value=p.css||'';E.js.value=p.js||'';current=P[p.preset]?p.preset:'blank';return}catch{}}try{const p=JSON.parse(localStorage.getItem('weblab-v1'));if(p){E.html.value=p.html||'';E.css.value=p.css||'';E.js.value=p.js||'';current=P[p.preset]?p.preset:'blank';return}}catch{}preset('blank',false)}
load();renderPresets();run();
</script>
</body>
</html>
